services:
  medvoice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medvoice
    ports:
      - "9999:9999"
    env_file:
      - src/.env
    volumes:
      - ./src/recordings:/app/recordings       # drop audio files here on the host
      - ./src/uploads:/app/uploads             # results appear here on the host
    restart: unless-stopped