# MedVoice — Docker Compose stack (local / dev).
#
#   docker compose up -d --build        start (builds the image if needed)
#   docker compose ps                   status + health
#   docker compose logs -f medvoice-app follow app logs
#   docker compose down                 stop (keeps the mongo volume)
#
# Configuration comes from src/.env through env_file. That file is never copied
# into the image and its contents are never printed or logged.
#
# The pipeline overrides two values without editing this file:
#   MEDVOICE_IMAGE     registry image + tag to deploy (default: local build)
#   MEDVOICE_ENV_FILE  path to the server's existing env file (default: src/.env)
name: medvoice
services:
  # ── MongoDB — LOCAL/DEV ONLY ───────────────────────────────────────────────
  # Published on 27017 so host runs can reach it at mongodb://localhost:27017.
  # Inside compose network, reachable at mongodb://medvoice-mongo:27017.
  medvoice-mongo:
    image: mongo:7
    container_name: medvoice-mongo
    ports:
      # Host port 27017 is already allocated by another container (mongo-insurance),
      # so expose on 27018 for host access while internal container port stays 27017.
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-medvoice_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-MedVoiceSecure2026}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-medvoice}
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGODB_USER:-medvoice_user}", "-p", "${MONGODB_PASSWORD:-MedVoiceSecure2026}", "--authenticationDatabase", "admin", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── MedVoice app ───────────────────────────────────────────────────────────
  medvoice-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${MEDVOICE_IMAGE:-medvoice-medvoice}
    container_name: medvoice-app
    ports:
      # Host:container — the app listens on 7777 (src/app.py).
      - "7777:7777"
    depends_on:
      medvoice-mongo:
        condition: service_healthy
    env_file:
      - ${MEDVOICE_ENV_FILE:-src/.env}
    environment:
      # Override the Mongo URI with credentials inside the container network:
      MONGODB_URI: mongodb://${MONGODB_USER:-medvoice_user}:${MONGODB_PASSWORD:-MedVoiceSecure2026}@medvoice-mongo:27017/${MONGODB_DATABASE:-medvoice}?authSource=${MONGODB_AUTH_SOURCE:-admin}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-medvoice}
    volumes:
      - ./src/uploads:/app/uploads        # uploaded audio (PHI) — host folder
      - ./src/logs:/app/logs              # usage.jsonl / feedback.jsonl (PHI)
    healthcheck:
      # Liveness only (no I/O): an STT outage must not restart the container.
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7777/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  mongo_data: