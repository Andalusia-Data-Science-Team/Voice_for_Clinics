services:
  medvoice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medvoice
    ports:
      - "9999:9999"
    env_file:
      - src/.env
    volumes:
      - ./src/uploads:/app/uploads        # results appear here on the host
      - ./src/static:/app/static          # ← added: serves index.html
      - ./src/logs:/app/logs              # ← added: serves log files
    restart: unless-stopped