<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Voice Assistant — Dashboard</title>
<style>
  :root {
    --bg:           #f3ede2;
    --surface:      #fffdfa;
    --surface-2:    #faf5eb;
    --surface-3:    #f3ebdc;
    --border:       #e6dcc8;
    --border-mid:   #d3c3a8;
    --text-1:       #241c14;
    --text-2:       #59503f;
    --text-3:       #948669;
    --accent:       #b5502f;
    --accent-2:     #d97b3f;
    --accent-3:     #e8a55c;
    --accent-light: #fbeee0;
    --red:          #b5502f;
    --red-light:    #fbe9e2;
    --green:        #4f7a4a;
    --green-light:  #eaf1e6;
    --amber:        #a3762f;
    --amber-light:  #f8edd6;
    --blue:         #3f6e8c;
    --blue-light:   #e6f0f5;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 18px;
    --shadow-sm: 0 1px 3px rgba(36,28,20,0.07), 0 1px 2px rgba(36,28,20,0.05);
    --shadow-md: 0 8px 24px rgba(36,28,20,0.10), 0 2px 6px rgba(36,28,20,0.06);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text-1); font-family: var(--sans);
    background:
      radial-gradient(1100px 420px at 12% -10%, rgba(216,123,63,0.14), transparent 60%),
      radial-gradient(900px 380px at 100% 0%, rgba(181,80,47,0.10), transparent 55%),
      var(--bg);
    min-height: 100vh;
  }
  .wrap { max-width: 1220px; margin: 0 auto; padding: 0 20px 60px; }

  /* ── Hero header ── */
  .hero {
    margin: 0 -20px 26px; padding: 30px 20px 26px;
    background: linear-gradient(135deg, #7c3d22 0%, #b5502f 45%, #d97b3f 100%);
    color: #fff8f0; box-shadow: 0 10px 30px rgba(124,61,34,0.25);
  }
  .hero-inner { max-width: 1220px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .hero-title { font-size: 23px; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  .hero-sub { font-size: 12.5px; opacity: 0.88; margin-top: 5px; }
  .hero-controls { display: flex; align-items: center; gap: 10px; }
  .hero-controls select {
    font-family: var(--sans); font-size: 12.5px; font-weight: 600; padding: 9px 12px;
    border: 1px solid rgba(255,255,255,0.35); border-radius: 99px; background: rgba(255,255,255,0.14);
    color: #fff; outline: none; appearance: none; cursor: pointer;
  }
  .hero-controls select option { color: #241c14; }
  .btn-refresh {
    font-family: var(--sans); font-size: 12.5px; font-weight: 700; padding: 9px 20px; border: none;
    border-radius: 99px; background: #fff; color: var(--accent); cursor: pointer; box-shadow: var(--shadow-sm);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .btn-refresh:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-refresh:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-refresh.spinning::before { content: '↻ '; display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 700; color: var(--text-3);
    background: none; border: none; padding: 10px 6px; cursor: pointer; position: relative;
    display: flex; align-items: center; gap: 6px;
  }
  .tab-btn .count-pill { font-size: 10.5px; font-weight: 700; background: var(--surface-3); color: var(--text-3); border-radius: 99px; padding: 1px 8px; }
  .tab-btn.active { color: var(--accent); }
  .tab-btn.active .count-pill { background: var(--accent-light); color: var(--accent); }
  .tab-btn::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2.5px;
    background: var(--accent); border-radius: 2px; transform: scaleX(0); transition: transform 0.15s;
  }
  .tab-btn.active::after { transform: scaleX(1); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadein 0.18s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .section { margin-bottom: 28px; }
  .section-title { font-size: 13.5px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--text-1); }
  .section-hint { font-size: 11.5px; font-weight: 500; color: var(--text-3); }

  /* ── KPI cards ── */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi-card {
    position: relative; overflow: hidden;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
    padding: 14px 16px; box-shadow: var(--shadow-sm); transition: transform 0.15s, box-shadow 0.15s;
  }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent-3));
  }
  .kpi-card.kpi-red::before { background: linear-gradient(90deg, var(--red), #d97b6a); }
  .kpi-card.kpi-green::before { background: linear-gradient(90deg, var(--green), #7fae72); }
  .kpi-card.kpi-blue::before { background: linear-gradient(90deg, var(--blue), #7fb0cf); }
  .kpi-icon { font-size: 15px; margin-bottom: 6px; opacity: 0.85; }
  .kpi-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); }
  .kpi-value { font-size: 25px; font-weight: 800; margin-top: 3px; letter-spacing: -0.02em; }
  .kpi-value.small { font-size: 16px; }
  .kpi-breakdown { font-size: 11px; color: var(--text-3); margin-top: 5px; line-height: 1.6; }
  .kpi-breakdown b { color: var(--text-2); font-weight: 700; }

  /* ── Chart ── */
  .chart-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
    padding: 18px 20px 10px; box-shadow: var(--shadow-sm);
  }
  .bar-chart { display: flex; align-items: flex-end; gap: 7px; height: 140px; margin-top: 8px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
  .bar-col .bar {
    width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; min-height: 3px;
    background: linear-gradient(180deg, var(--accent-3), var(--accent-2));
    box-shadow: 0 2px 6px rgba(217,123,63,0.35);
    transition: filter 0.12s;
  }
  .bar-col:hover .bar { filter: brightness(1.08); }
  .bar-col .bar-val { font-size: 10px; font-weight: 700; color: var(--text-2); }
  .bar-col .bar-label { font-size: 9.5px; color: var(--text-3); white-space: nowrap; margin-top: 2px; margin-bottom: 8px; transform: rotate(-38deg); transform-origin: top left; }

  /* ── Distribution bars (dept/lang/mode mix) ── */
  .dist-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow-sm); }
  .dist-row { margin-bottom: 12px; }
  .dist-row:last-child { margin-bottom: 0; }
  .dist-row-hd { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 700; color: var(--text-2); margin-bottom: 5px; }
  .dist-track { height: 9px; border-radius: 99px; background: var(--surface-3); overflow: hidden; display: flex; }
  .dist-seg { height: 100%; transition: width 0.3s; }
  .dist-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 10.5px; color: var(--text-3); }
  .dist-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dist-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* ── Tables ── */
  .table-toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
  .table-toolbar input[type="search"] {
    flex: 1; font-family: var(--sans); font-size: 12.5px; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: var(--r-md); background: var(--surface); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
  }
  .table-toolbar input[type="search"]:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-light); }
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .table-wrap { max-height: 560px; overflow-y: auto; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    text-align: left; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-3); background: var(--surface-2); padding: 10px 12px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 1; white-space: nowrap;
  }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text-1); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.data-row:hover { background: var(--accent-light); }
  tbody tr.data-row.flash { animation: flash-highlight 1.6s ease; }
  @keyframes flash-highlight { 0%, 40% { background: var(--amber-light); } 100% { background: transparent; } }

  .tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
  .tag.dep-er { background: var(--red-light); color: var(--red); border-color: #f0cdbd; }
  .tag.dep-opd { background: var(--green-light); color: var(--green); border-color: #d3e0cb; }
  .tag.dep-dental { background: var(--amber-light); color: var(--amber); border-color: #ecdcae; }
  .tag.status-error { background: var(--red-light); color: var(--red); border-color: #f0cdbd; }
  .tag.status-ok { background: var(--green-light); color: var(--green); border-color: #d3e0cb; }
  .thumb { font-size: 15px; }
  .cell-text { max-width: 340px; white-space: pre-wrap; word-break: break-word; }
  .cell-muted { color: var(--text-3); }
  .cell-mono { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .session-link {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--blue); background: var(--blue-light);
    border: 1px solid #cfe0e9; border-radius: 6px; padding: 2px 7px; cursor: pointer; white-space: nowrap;
  }
  .session-link:hover { filter: brightness(0.95); }
  .btn-details {
    font-size: 10.5px; font-weight: 700; color: var(--accent); background: none; border: 1px solid var(--border-mid);
    border-radius: 99px; padding: 3px 10px; cursor: pointer; white-space: nowrap;
  }
  .btn-details:hover { background: var(--accent-light); }
  .details-row td { background: var(--surface-2); }
  .details-json {
    font-family: var(--mono); font-size: 11px; white-space: pre-wrap; word-break: break-word;
    max-height: 340px; overflow-y: auto; margin: 0;
  }
  .step-time { font-family: var(--mono); font-size: 11px; }
  .step-time.na { color: var(--text-3); }

  .empty-state { padding: 40px 20px; text-align: center; color: var(--text-3); font-size: 13px; }
  .loading-state { padding: 60px 20px; text-align: center; color: var(--text-3); font-size: 13px; }
  .warn-banner {
    background: var(--amber-light); border: 1px solid #ecdcae; color: var(--amber);
    border-radius: var(--r-md); padding: 11px 15px; font-size: 12px; margin-bottom: 18px; line-height: 1.6;
    display: flex; gap: 8px; align-items: flex-start;
  }
</style>
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    <div>
      <div class="hero-title">🩺 Medical Voice Assistant — Dashboard</div>
      <div class="hero-sub" id="dash-sub">Loading…</div>
    </div>
    <div class="hero-controls">
      <select id="range-select">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="0">All time</option>
      </select>
      <button class="btn-refresh" id="btn-refresh">Refresh</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="sessions">Sessions <span class="count-pill" id="sessions-count">0</span></button>
    <button class="tab-btn" data-tab="feedback">Feedback <span class="count-pill" id="feedback-count">0</span></button>
  </div>

  <div id="dash-body">
    <div class="loading-state">Loading usage and feedback logs…</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function dayKey(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return d.toISOString().slice(0, 10);
}
function pct(n, total) { return total ? Math.round((n / total) * 100) : 0; }
function fmtSec(v) {
  return (typeof v === 'number') ? `<span class="step-time">${v.toFixed(1)}s</span>` : `<span class="step-time na">—</span>`;
}
function shortId(id) {
  if (!id) return null;
  return String(id).length > 10 ? String(id).slice(0, 8) : String(id);
}

let usageEntries = [];
let feedbackEntries = [];
let usageById = {}; // session_id -> usage entry, for feedback→session linking

async function loadAll() {
  const btn = $('btn-refresh');
  btn.disabled = true;
  btn.classList.add('spinning');
  $('dash-sub').textContent = 'Refreshing…';
  try {
    const [uResp, fResp] = await Promise.all([
      fetch('/admin/usage?limit=3000'),
      fetch('/admin/feedback?limit=3000'),
    ]);
    if (uResp.status === 401 || fResp.status === 401) {
      $('dash-body').innerHTML = '<div class="empty-state">401 — not authorized. Log in with the dashboard credentials.</div>';
      $('dash-sub').textContent = 'Not authorized';
      return;
    }
    const uData = uResp.ok ? await uResp.json() : { entries: [] };
    const fData = fResp.ok ? await fResp.json() : { entries: [] };
    usageEntries = uData.entries || [];
    feedbackEntries = fData.entries || [];
    usageById = {};
    usageEntries.forEach((e, i) => { if (e.session_id) usageById[e.session_id] = i; });
    render();
    $('dash-sub').textContent = 'Last updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.error('[Dashboard] Load failed:', e);
    $('dash-body').innerHTML = '<div class="empty-state">Failed to load logs — check the console and that /admin/usage and /admin/feedback are reachable.</div>';
    $('dash-sub').textContent = 'Load failed';
  } finally {
    btn.disabled = false;
    btn.classList.remove('spinning');
  }
}

function withinRange(iso, days) {
  if (!days) return true;
  const d = new Date(iso);
  if (isNaN(d)) return false;
  const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
  return d.getTime() >= cutoff;
}

let currentUsage = [];
let currentFeedback = [];

function render() {
  const days = Number($('range-select').value);
  currentUsage = usageEntries.filter(e => withinRange(e.timestamp, days));
  currentFeedback = feedbackEntries.filter(e => withinRange(e.timestamp, days));

  $('sessions-count').textContent = currentUsage.length;
  $('feedback-count').textContent = currentFeedback.length;

  $('dash-body').innerHTML = `
    <div class="tab-panel active" id="panel-overview">
      ${renderUsageKpis(currentUsage)}
      ${renderDailyChart(currentUsage)}
      ${renderDistributions(currentUsage)}
      ${renderFeedbackKpis(currentFeedback)}
    </div>
    <div class="tab-panel" id="panel-sessions">
      ${renderSessionsTable(currentUsage)}
    </div>
    <div class="tab-panel" id="panel-feedback">
      ${renderFeedbackTable(currentFeedback)}
    </div>
  `;

  wireTabs();
  wireDetailToggles();
  wireSearch('sessions-search', '#sessions-table tbody tr.data-row');
  wireSearch('feedback-search', '#feedback-table tbody tr.data-row');
  wireSessionLinks();
}

function wireTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      $('panel-' + btn.dataset.tab).classList.add('active');
    });
  });
}

function renderUsageKpis(usage) {
  const total = usage.length;
  const errors = usage.filter(e => e.status && e.status !== 'ok').length;
  const byDept = {}, byLang = {}, byMode = {};
  let totalSecSum = 0, totalSecCount = 0;
  let historyUsedCount = 0;

  usage.forEach(e => {
    byDept[e.department || '—'] = (byDept[e.department || '—'] || 0) + 1;
    byLang[e.language || '—']   = (byLang[e.language || '—'] || 0) + 1;
    byMode[e.mode || '—']       = (byMode[e.mode || '—'] || 0) + 1;
    if (typeof e.total_sec === 'number') { totalSecSum += e.total_sec; totalSecCount++; }
    if (e.use_history) historyUsedCount++;
  });

  const breakdown = (obj) => Object.entries(obj).sort((a,b) => b[1]-a[1])
    .map(([k,v]) => `<b>${esc(k)}</b>: ${v}`).join(' &nbsp;·&nbsp; ') || '—';
  const avgSec = totalSecCount ? (totalSecSum / totalSecCount).toFixed(1) + 's' : '—';

  return `
  <div class="section">
    <div class="section-title">📈 Usage</div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-icon">🗂️</div><div class="kpi-label">Total Sessions</div><div class="kpi-value">${total}</div></div>
      <div class="kpi-card ${errors ? 'kpi-red' : ''}"><div class="kpi-icon">⚠️</div><div class="kpi-label">Errors</div><div class="kpi-value" style="color:${errors ? 'var(--red)' : 'var(--text-1)'}">${errors}</div><div class="kpi-breakdown">${pct(errors,total)}% of sessions</div></div>
      <div class="kpi-card kpi-blue"><div class="kpi-icon">⏱️</div><div class="kpi-label">Avg. Total Time</div><div class="kpi-value small">${avgSec}</div></div>
      <div class="kpi-card kpi-green"><div class="kpi-icon">📜</div><div class="kpi-label">History Used</div><div class="kpi-value small">${historyUsedCount}</div><div class="kpi-breakdown">${pct(historyUsedCount,total)}% of sessions</div></div>
      <div class="kpi-card"><div class="kpi-icon">🏥</div><div class="kpi-label">By Department</div><div class="kpi-breakdown">${breakdown(byDept)}</div></div>
      <div class="kpi-card"><div class="kpi-icon">🌐</div><div class="kpi-label">By Language</div><div class="kpi-breakdown">${breakdown(byLang)}</div></div>
      <div class="kpi-card"><div class="kpi-icon">🗣️</div><div class="kpi-label">By Mode</div><div class="kpi-breakdown">${breakdown(byMode)}</div></div>
    </div>
  </div>`;
}

function renderDailyChart(usage) {
  const counts = {};
  usage.forEach(e => { const k = dayKey(e.timestamp); if (k) counts[k] = (counts[k] || 0) + 1; });
  const days = Object.keys(counts).sort().slice(-21);
  const max = Math.max(1, ...days.map(d => counts[d]));

  if (!days.length) {
    return `<div class="section"><div class="section-title">📅 Sessions per Day</div><div class="chart-card"><div class="empty-state">No sessions in this range.</div></div></div>`;
  }
  const bars = days.map(d => {
    const v = counts[d];
    const h = Math.max(3, Math.round((v / max) * 110));
    const label = new Date(d + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return `<div class="bar-col" title="${esc(label)}: ${v}"><div class="bar-val">${v}</div><div class="bar" style="height:${h}px"></div><div class="bar-label">${esc(label)}</div></div>`;
  }).join('');

  return `
  <div class="section">
    <div class="section-title">📅 Sessions per Day</div>
    <div class="chart-card"><div class="bar-chart">${bars}</div></div>
  </div>`;
}

const DIST_COLORS = ['var(--accent-2)', 'var(--blue)', 'var(--green)', 'var(--amber)', 'var(--red)', '#9b7fbf'];

function distBar(obj, total) {
  const entries = Object.entries(obj).sort((a,b) => b[1]-a[1]);
  const segs = entries.map(([k,v], i) => {
    const w = pct(v, total);
    return `<div class="dist-seg" style="width:${w}%; background:${DIST_COLORS[i % DIST_COLORS.length]}" title="${esc(k)}: ${v} (${w}%)"></div>`;
  }).join('');
  const legend = entries.map(([k,v], i) =>
    `<span><span class="dist-dot" style="background:${DIST_COLORS[i % DIST_COLORS.length]}"></span>${esc(k)} (${v})</span>`
  ).join('');
  return `<div class="dist-track">${segs}</div><div class="dist-legend">${legend}</div>`;
}

function renderDistributions(usage) {
  const total = usage.length;
  const byDept = {}, byLang = {}, byMode = {};
  usage.forEach(e => {
    byDept[e.department || 'unknown'] = (byDept[e.department || 'unknown'] || 0) + 1;
    byLang[(e.language || 'unknown').toUpperCase()] = (byLang[(e.language || 'unknown').toUpperCase()] || 0) + 1;
    byMode[e.mode || 'unknown'] = (byMode[e.mode || 'unknown'] || 0) + 1;
  });
  if (!total) return '';
  return `
  <div class="section">
    <div class="section-title">🧭 Mix</div>
    <div class="dist-card">
      <div class="dist-row"><div class="dist-row-hd"><span>Department</span></div>${distBar(byDept, total)}</div>
      <div class="dist-row"><div class="dist-row-hd"><span>Language</span></div>${distBar(byLang, total)}</div>
      <div class="dist-row"><div class="dist-row-hd"><span>Mode</span></div>${distBar(byMode, total)}</div>
    </div>
  </div>`;
}

function renderFeedbackKpis(feedback) {
  const total = feedback.length;
  const up = feedback.filter(e => e.rating === 'up').length;
  const down = feedback.filter(e => e.rating === 'down').length;
  const withText = feedback.filter(e => e.text && e.text.trim()).length;

  return `
  <div class="section">
    <div class="section-title">💬 Feedback</div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-icon">🗒️</div><div class="kpi-label">Total</div><div class="kpi-value">${total}</div></div>
      <div class="kpi-card kpi-green"><div class="kpi-icon">👍</div><div class="kpi-label">Thumbs Up</div><div class="kpi-value" style="color:var(--green)">${up}</div><div class="kpi-breakdown">${pct(up, up+down)}% of rated</div></div>
      <div class="kpi-card kpi-red"><div class="kpi-icon">👎</div><div class="kpi-label">Thumbs Down</div><div class="kpi-value" style="color:var(--red)">${down}</div><div class="kpi-breakdown">${pct(down, up+down)}% of rated</div></div>
      <div class="kpi-card"><div class="kpi-icon">✍️</div><div class="kpi-label">With Written Note</div><div class="kpi-value small">${withText}</div></div>
    </div>
  </div>`;
}

function renderFeedbackTable(feedback) {
  const rows = feedback.map((e, i) => {
    const sid = e.session_id;
    const sessionCell = sid
      ? (usageById.hasOwnProperty(sid)
          ? `<button class="session-link" data-jump="${esc(sid)}" title="Jump to this session">${esc(shortId(sid))} ↗</button>`
          : `<span class="cell-mono" title="${esc(sid)}">${esc(shortId(sid))}</span>`)
      : '<span class="cell-muted">—</span>';
    return `
    <tr class="data-row">
      <td>${fmtDate(e.timestamp)}</td>
      <td>${sessionCell}</td>
      <td>${esc(e.name || e.sso_user || '—')}</td>
      <td class="thumb">${e.rating === 'up' ? '👍' : e.rating === 'down' ? '👎' : '<span class="cell-muted">—</span>'}</td>
      <td>${e.department ? `<span class="tag dep-${esc(e.department)}">${esc(e.department.toUpperCase())}</span>` : '<span class="cell-muted">—</span>'}</td>
      <td>${esc((e.language || '—').toUpperCase())}</td>
      <td class="cell-text">${esc(e.text) || '<span class="cell-muted">—</span>'}</td>
    </tr>`;
  }).join('');

  return `
  <div class="section">
    <div class="section-title">💬 Feedback Log <span class="section-hint">click a session ID to jump to it in the Sessions tab</span></div>
    <div class="table-toolbar"><input type="search" id="feedback-search" placeholder="Search feedback text or name…"></div>
    <div class="table-card"><div class="table-wrap">
      <table id="feedback-table">
        <thead><tr><th>When</th><th>Session</th><th>Name</th><th>Rating</th><th>Dept</th><th>Lang</th><th>Note</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="7"><div class="empty-state">No feedback in this range.</div></td></tr>`}</tbody>
      </table>
    </div></div>
  </div>`;
}

function renderSessionsTable(usage) {
  const rows = usage.map((e, i) => {
    const statusTag = (e.status && e.status !== 'ok')
      ? `<span class="tag status-error">${esc(e.status)}</span>`
      : `<span class="tag status-ok">ok</span>`;
    const deptTag = e.department ? `<span class="tag dep-${esc(e.department)}">${esc(e.department.toUpperCase())}</span>` : '—';
    const who = esc(e.clinician_name || e.sso_user || '—');
    const sid = e.session_id ? `<span class="cell-mono" title="${esc(e.session_id)}">${esc(shortId(e.session_id))}</span>` : '<span class="cell-muted">—</span>';
    return `
    <tr class="data-row" id="session-row-${esc(e.session_id || i)}">
      <td>${fmtDate(e.timestamp)}</td>
      <td>${sid}</td>
      <td>${who}</td>
      <td>${deptTag}</td>
      <td>${esc((e.language || '—').toUpperCase())}</td>
      <td>${esc(e.mode || '—')}</td>
      <td>${fmtSec(e.transcription_sec)}</td>
      <td>${fmtSec(e.refinement_sec)}</td>
      <td>${fmtSec(e.translation_sec)}</td>
      <td>${fmtSec(e.extraction_sec)}</td>
      <td>${fmtSec(e.total_sec)}</td>
      <td>${statusTag}</td>
      <td><button class="btn-details" data-idx="${i}">Details</button></td>
    </tr>
    <tr class="details-row" id="details-${i}" style="display:none">
      <td colspan="13"><pre class="details-json">${esc(JSON.stringify(e, null, 2))}</pre></td>
    </tr>`;
  }).join('');

  window.__sessionsForDetails = usage;

  return `
  <div class="section">
    <div class="section-title">🗂️ Recent Sessions <span class="section-hint">clinical content hidden by default — click "Details" to expand a row</span></div>
    <div class="table-toolbar"><input type="search" id="sessions-search" placeholder="Search clinician, department, status…"></div>
    <div class="table-card"><div class="table-wrap">
      <table id="sessions-table">
        <thead><tr>
          <th>When</th><th>Session</th><th>Clinician</th><th>Dept</th><th>Lang</th><th>Mode</th>
          <th>Transcribe</th><th>Refine</th><th>Translate</th><th>Extract</th><th>Total</th><th>Status</th><th></th>
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="13"><div class="empty-state">No sessions in this range.</div></td></tr>`}</tbody>
      </table>
    </div></div>
  </div>`;
}

function wireDetailToggles() {
  document.querySelectorAll('.btn-details').forEach(btn => {
    btn.addEventListener('click', () => {
      const row = $('details-' + btn.dataset.idx);
      if (!row) return;
      const showing = row.style.display !== 'none';
      row.style.display = showing ? 'none' : '';
      btn.textContent = showing ? 'Details' : 'Hide';
    });
  });
}

function wireSearch(inputId, rowSelector) {
  const input = $(inputId);
  if (!input) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    document.querySelectorAll(rowSelector).forEach(tr => {
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

function wireSessionLinks() {
  document.querySelectorAll('.session-link[data-jump]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.jump;
      // Switch to the Sessions tab
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelector('.tab-btn[data-tab="sessions"]').classList.add('active');
      $('panel-sessions').classList.add('active');
      const row = $('session-row-' + sid);
      if (row) {
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
      }
    });
  });
}

$('btn-refresh').addEventListener('click', loadAll);
$('range-select').addEventListener('change', render);
loadAll();
</script>
</body>
</html>
