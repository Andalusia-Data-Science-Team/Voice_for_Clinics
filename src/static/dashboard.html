<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Voice Assistant — Enterprise Observability & Financial Dashboard</title>
<style>
  :root {
    --bg:           #0f141c;
    --surface:      #18202c;
    --surface-2:    #1f2a3a;
    --surface-3:    #29374c;
    --border:       #2a3b50;
    --border-light: #3b506d;
    --text-1:       #f0f4f8;
    --text-2:       #9bb0cc;
    --text-3:       #647b99;
    --accent:       #38bdf8;
    --accent-glow:  rgba(56, 189, 248, 0.15);
    --accent-2:     #818cf8;
    --green:        #34d399;
    --green-glow:   rgba(52, 211, 153, 0.15);
    --amber:        #fbbf24;
    --amber-glow:   rgba(251, 191, 36, 0.15);
    --red:          #f87171;
    --red-glow:     rgba(248, 113, 113, 0.15);
    --purple:       #c084fc;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.45);
    --shadow-lg: 0 14px 36px rgba(0,0,0,0.6);
    --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text-1); font-family: var(--sans);
    background:
      radial-gradient(1000px 500px at 10% -5%, rgba(56, 189, 248, 0.12), transparent 50%),
      radial-gradient(800px 400px at 90% 0%, rgba(129, 140, 248, 0.10), transparent 50%),
      var(--bg);
    min-height: 100vh;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px 60px; }

  /* ── Header ── */
  .hero {
    margin: 0 -24px 28px; padding: 26px 24px 22px;
    background: linear-gradient(135deg, #111a28 0%, #18283f 50%, #1e3352 100%);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-md);
  }
  .hero-inner { max-width: 1320px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .hero-brand { display: flex; align-items: center; gap: 12px; }
  .hero-logo {
    width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
  }
  .hero-title { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  .hero-sub { font-size: 12px; color: var(--text-2); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .badge-role {
    font-size: 10.5px; font-weight: 700; padding: 2px 9px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .role-admin { background: var(--green-glow); color: var(--green); border: 1px solid rgba(52, 211, 153, 0.3); }
  .role-stakeholder { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }

  .hero-controls { display: flex; align-items: center; gap: 10px; }
  .hero-controls select {
    font-family: var(--sans); font-size: 12.5px; font-weight: 600; padding: 9px 14px;
    border: 1px solid var(--border-light); border-radius: 99px; background: var(--surface-2);
    color: var(--text-1); outline: none; cursor: pointer; transition: border-color 0.15s;
  }
  .hero-controls select:hover { border-color: var(--accent); }
  .btn-refresh {
    font-family: var(--sans); font-size: 12.5px; font-weight: 700; padding: 9px 20px; border: none;
    border-radius: 99px; background: var(--accent); color: #081018; cursor: pointer; box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
    transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
  }
  .btn-refresh:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 0 24px rgba(56, 189, 248, 0.5); }
  .btn-refresh:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-refresh.spinning::before { content: '↻ '; display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Navigation Tabs ── */
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 700; color: var(--text-3);
    background: none; border: none; padding: 12px 14px; cursor: pointer; position: relative;
    display: flex; align-items: center; gap: 8px; transition: color 0.15s;
  }
  .tab-btn:hover { color: var(--text-2); }
  .tab-btn .count-pill { font-size: 10.5px; font-weight: 700; background: var(--surface-3); color: var(--text-2); border-radius: 99px; padding: 1px 8px; }
  .tab-btn.active { color: var(--accent); }
  .tab-btn.active .count-pill { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }
  .tab-btn::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;
    background: var(--accent); border-radius: 3px 3px 0 0; transform: scaleX(0); transition: transform 0.18s;
  }
  .tab-btn.active::after { transform: scaleX(1); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadein 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .section { margin-bottom: 32px; }
  .section-title { font-size: 14px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; color: var(--text-1); letter-spacing: 0.02em; }
  .section-hint { font-size: 11.5px; font-weight: 500; color: var(--text-3); }

  /* ── KPI Grid ── */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .kpi-card {
    position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow-sm); transition: transform 0.15s, border-color 0.15s;
  }
  .kpi-card:hover { transform: translateY(-2px); border-color: var(--border-light); }
  .kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  .kpi-card.kpi-green::before { background: linear-gradient(90deg, var(--green), #10b981); }
  .kpi-card.kpi-amber::before { background: linear-gradient(90deg, var(--amber), #f59e0b); }
  .kpi-card.kpi-red::before   { background: linear-gradient(90deg, var(--red), #ef4444); }
  .kpi-card.kpi-purple::before{ background: linear-gradient(90deg, var(--purple), #a855f7); }

  .kpi-icon { font-size: 18px; margin-bottom: 8px; opacity: 0.9; }
  .kpi-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); }
  .kpi-value { font-size: 26px; font-weight: 800; margin-top: 4px; letter-spacing: -0.02em; color: var(--text-1); }
  .kpi-value.green { color: var(--green); }
  .kpi-value.accent { color: var(--accent); }
  .kpi-value.amber { color: var(--amber); }
  .kpi-subtext { font-size: 11.5px; color: var(--text-2); margin-top: 6px; line-height: 1.5; }
  .kpi-subtext b { color: var(--text-1); }

  /* ── Matrix & Analytics Card ── */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
    padding: 20px 22px; box-shadow: var(--shadow-sm);
  }

  /* ── Interactive SVG Cost vs Value Chart ── */
  .chart-container { width: 100%; height: 260px; position: relative; margin-top: 14px; }
  svg.chart-svg { width: 100%; height: 100%; overflow: visible; }
  .chart-tooltip {
    position: absolute; display: none; background: #0c1219; border: 1px solid var(--border-light);
    border-radius: var(--r-sm); padding: 8px 12px; font-size: 11px; color: var(--text-1); pointer-events: none;
    box-shadow: var(--shadow-md); z-index: 10; white-space: nowrap;
  }
  .chart-legend { display: flex; gap: 20px; align-items: center; justify-content: flex-end; font-size: 11.5px; margin-top: 8px; color: var(--text-2); }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .legend-line { width: 14px; height: 3px; border-radius: 2px; }

  /* ── Departmental Matrix Table ── */
  table.matrix-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  table.matrix-table th {
    text-align: left; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-3); background: var(--surface-2); padding: 11px 14px; border-bottom: 1px solid var(--border);
  }
  table.matrix-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--text-1); vertical-align: middle; }
  table.matrix-table tr:last-child td { border-bottom: none; }
  table.matrix-table tr:hover td { background: rgba(56, 189, 248, 0.04); }

  /* ── Standard Data Table ── */
  .table-toolbar { display: flex; gap: 10px; margin-bottom: 12px; }
  .table-toolbar input[type="search"] {
    flex: 1; font-family: var(--sans); font-size: 12.5px; padding: 10px 14px; border: 1px solid var(--border);
    border-radius: var(--r-md); background: var(--surface); color: var(--text-1); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
  }
  .table-toolbar input[type="search"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .table-wrap { max-height: 580px; overflow-y: auto; overflow-x: auto; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.data-table thead th {
    text-align: left; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-3); background: var(--surface-2); padding: 11px 14px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 1; white-space: nowrap;
  }
  table.data-table tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text-1); }
  table.data-table tbody tr:last-child td { border-bottom: none; }
  table.data-table tbody tr.data-row:hover { background: rgba(56, 189, 248, 0.05); }

  .tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
  .tag.dep-er { background: var(--red-glow); color: var(--red); border-color: rgba(248, 113, 113, 0.3); }
  .tag.dep-opd { background: var(--green-glow); color: var(--green); border-color: rgba(52, 211, 153, 0.3); }
  .tag.dep-dental { background: var(--amber-glow); color: var(--amber); border-color: rgba(251, 191, 36, 0.3); }
  .tag.status-error { background: var(--red-glow); color: var(--red); border-color: rgba(248, 113, 113, 0.3); }
  .tag.status-ok { background: var(--green-glow); color: var(--green); border-color: rgba(52, 211, 153, 0.3); }
  .cell-mono { font-family: var(--mono); font-size: 10.5px; color: var(--text-2); }
  .cell-muted { color: var(--text-3); }
  .session-link {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--accent); background: var(--accent-glow);
    border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 6px; padding: 2px 7px; cursor: pointer; white-space: nowrap;
  }
  .session-link:hover { filter: brightness(1.15); }
  .btn-details {
    font-size: 10.5px; font-weight: 700; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border-light);
    border-radius: 99px; padding: 3px 10px; cursor: pointer; white-space: nowrap; transition: all 0.12s;
  }
  .btn-details:hover { color: var(--accent); border-color: var(--accent); }
  .details-row td { background: var(--surface-2); }
  .details-json {
    font-family: var(--mono); font-size: 11px; white-space: pre-wrap; word-break: break-word;
    max-height: 340px; overflow-y: auto; margin: 0; color: var(--text-2);
  }
  .step-time { font-family: var(--mono); font-size: 11px; }

  .empty-state { padding: 48px 20px; text-align: center; color: var(--text-3); font-size: 13px; }
  .loading-state { padding: 60px 20px; text-align: center; color: var(--text-2); font-size: 14px; }
  .phi-badge { font-size: 10px; background: rgba(52, 211, 153, 0.12); color: var(--green); border: 1px solid rgba(52, 211, 153, 0.25); border-radius: 4px; padding: 2px 6px; }

  /* ── Rate Card Modal ── */
  .rate-toggle-btn {
    font-size: 11px; font-weight: 600; color: var(--text-3); background: none; border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 4px 8px; cursor: pointer; transition: color 0.12s, border-color 0.12s;
  }
  .rate-toggle-btn:hover { color: var(--text-1); border-color: var(--border-light); }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-brand">
      <div class="hero-logo">🩺</div>
      <div>
        <div class="hero-title">
          Medical Voice Assistant
          <span style="font-size: 14px; color: var(--text-3); font-weight: 500;">| Enterprise Observability</span>
        </div>
        <div class="hero-sub" id="dash-sub">
          <span>Loading identity…</span>
        </div>
      </div>
    </div>
    <div class="hero-controls">
      <select id="currency-select" title="Toggle Currency Display">
        <option value="SAR" selected>Currency: SAR (1 USD = 3.75 SAR)</option>
        <option value="USD">Currency: USD ($)</option>
      </select>
      <select id="range-select">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="0">All time</option>
      </select>
      <button class="btn-refresh" id="btn-refresh">Refresh</button>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- Role-Adaptive Tabs Container -->
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="financial" id="tab-btn-financial">💰 Financial & ROI Impact</button>
    <button class="tab-btn" data-tab="overview" id="tab-btn-overview">📈 Operational Overview</button>
    <button class="tab-btn" data-tab="sessions" id="tab-btn-sessions">🗂️ Encounter Logs <span class="count-pill" id="sessions-count">0</span></button>
    <button class="tab-btn" data-tab="feedback" id="tab-btn-feedback">💬 Clinician Feedback <span class="count-pill" id="feedback-count">0</span></button>
    <button class="tab-btn" data-tab="audit" id="tab-btn-audit" style="display:none;">🔒 Audit & Security Probes</button>
  </div>

  <div id="dash-body">
    <div class="loading-state">Initializing role-based access and aggregating financial metrics…</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function pct(n, total) { return total ? Math.round((n / total) * 100) : 0; }
function fmtSec(v) {
  return (typeof v === 'number') ? `<span class="step-time">${v.toFixed(1)}s</span>` : `<span class="step-time cell-muted">—</span>`;
}
function shortId(id) {
  if (!id) return null;
  return String(id).length > 10 ? String(id).slice(0, 8) : String(id);
}

const SAR_PER_USD = 3.75;
let currentCurrency = 'SAR';

function fmtMoney(amountUsd) {
  if (typeof amountUsd !== 'number') return '—';
  if (currentCurrency === 'SAR') {
    const val = amountUsd * SAR_PER_USD;
    return val >= 1000 ? `${(val).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })} SAR` : `${val.toFixed(2)} SAR`;
  }
  return amountUsd >= 1000 ? `$${amountUsd.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })}` : `$${amountUsd.toFixed(2)}`;
}

let currentUser = null;
let financialData = null;
let usageEntries = [];
let feedbackEntries = [];
let healthData = null;
let usageById = {};

async function loadAll() {
  const btn = $('btn-refresh');
  btn.disabled = true;
  btn.classList.add('spinning');
  $('dash-sub').textContent = 'Refreshing observability metrics…';

  try {
    const [meResp, finResp, uResp, fResp, hResp] = await Promise.all([
      fetch('/admin/me').catch(() => null),
      fetch(`/admin/financial-summary?days=${$('range-select').value}`),
      fetch('/admin/usage?limit=3000'),
      fetch('/admin/feedback?limit=3000'),
      fetch('/health').catch(() => null)
    ]);

    if ((finResp && (finResp.status === 401 || finResp.status === 403)) ||
        (uResp && (uResp.status === 401 || uResp.status === 403))) {
      $('dash-body').innerHTML = '<div class="empty-state">403 Forbidden — Entra ID access denied. ClinicalAdmin or ExecutiveStakeholder role required.</div>';
      $('dash-sub').textContent = 'Access Denied';
      return;
    }

    if (meResp && meResp.ok) {
      currentUser = await meResp.json();
    }
    financialData = finResp.ok ? await finResp.json() : null;
    const uData = uResp.ok ? await uResp.json() : { entries: [] };
    const fData = fResp.ok ? await fResp.json() : { entries: [] };
    healthData = hResp && hResp.ok ? await hResp.json() : null;

    usageEntries = uData.entries || [];
    feedbackEntries = fData.entries || [];
    usageById = {};
    usageEntries.forEach((e, i) => { if (e.session_id) usageById[e.session_id] = i; });

    adaptRoleUI();
    render();

    const roleName = currentUser?.is_admin ? 'ClinicalAdmin' : (currentUser?.is_stakeholder ? 'ExecutiveStakeholder' : 'Auditor');
    const badgeClass = currentUser?.is_admin ? 'role-admin' : 'role-stakeholder';
    $('dash-sub').innerHTML = `
      <span>Authenticated as <b>${esc(currentUser?.display_name || 'User')}</b></span>
      <span class="badge-role ${badgeClass}">${esc(roleName)}</span>
      <span class="phi-badge">PHI Safe Log Enforced</span>
      <span style="color: var(--text-3)">· ${new Date().toLocaleTimeString()}</span>
    `;
  } catch (err) {
    console.error('[Dashboard] Error during fetch:', err);
    $('dash-body').innerHTML = '<div class="empty-state">Failed to load analytics. Please verify server endpoints.</div>';
    $('dash-sub').textContent = 'Sync Failed';
  } finally {
    btn.disabled = false;
    btn.classList.remove('spinning');
  }
}

function adaptRoleUI() {
  const isAdmin = currentUser?.is_admin === true;
  const auditTab = $('tab-btn-audit');
  if (auditTab) {
    auditTab.style.display = isAdmin ? 'flex' : 'none';
  }

  // If ExecutiveStakeholder, ensure default active tab is financial
  if (!isAdmin && !window.__userSwitchedTab) {
    switchTab('financial');
  }
}

function render() {
  const isAdmin = currentUser?.is_admin === true;
  $('sessions-count').textContent = usageEntries.length;
  $('feedback-count').textContent = feedbackEntries.length;

  $('dash-body').innerHTML = `
    <!-- Tab 1: Financial & ROI Impact -->
    <div class="tab-panel active" id="panel-financial">
      ${renderFinancialCards(financialData)}
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px;">
        ${renderCostVsValueCurve(financialData)}
        ${renderDepartmentMatrix(financialData)}
      </div>
      ${renderUnitEconomicsCard(financialData)}
    </div>

    <!-- Tab 2: Operational Overview -->
    <div class="tab-panel" id="panel-overview">
      ${renderUsageKpis(usageEntries)}
      ${renderDistributions(usageEntries)}
      ${renderFeedbackKpis(feedbackEntries)}
    </div>

    <!-- Tab 3: Encounter Logs -->
    <div class="tab-panel" id="panel-sessions">
      ${renderSessionsTable(usageEntries, isAdmin)}
    </div>

    <!-- Tab 4: Clinician Feedback -->
    <div class="tab-panel" id="panel-feedback">
      ${renderFeedbackTable(feedbackEntries, isAdmin)}
    </div>

    <!-- Tab 5: Audit & Health Probes (ClinicalAdmin Only) -->
    <div class="tab-panel" id="panel-audit">
      ${renderAuditSection(healthData)}
    </div>
  `;

  wireTabs();
  wireDetailToggles();
  wireSearch('sessions-search', '#sessions-table tbody tr.data-row');
  wireSearch('feedback-search', '#feedback-table tbody tr.data-row');
  wireSessionLinks();
  initCurveTooltips();
}

/* ─────────────────────────────────────────────────────────────
   Tab 1: Financial Impact & ROI Dashboard
   ───────────────────────────────────────────────────────────── */
function renderFinancialCards(fin) {
  if (!fin) return `<div class="empty-state">No financial data available for selected range.</div>`;
  const sv = fin.savings || {};
  const cs = fin.costs || {};

  return `
  <div class="section">
    <div class="section-title">
      <span>Executive Financial Summary</span>
      <span class="section-hint">Period: Last ${fin.period_days || 30} days · Rate card: $75/hr clinician baseline</span>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card kpi-green">
        <div class="kpi-icon">📈</div>
        <div class="kpi-label">Net Return on Investment</div>
        <div class="kpi-value green">+${sv.net_roi_percent || 0}%</div>
        <div class="kpi-subtext">Net ROI over direct AI infrastructure costs</div>
      </div>
      <div class="kpi-card kpi-green">
        <div class="kpi-icon">💰</div>
        <div class="kpi-label">Net Clinical Dollars Saved</div>
        <div class="kpi-value green">${fmtMoney(sv.net_savings_usd || 0)}</div>
        <div class="kpi-subtext">Gross Value: <b>${fmtMoney(sv.gross_value_saved_usd || 0)}</b></div>
      </div>
      <div class="kpi-card kpi-amber">

        <div class="kpi-subtext">Avg Encounter Cost: <b>${fmtMoney(cs.cost_per_session_usd || 0)}</b></div>

        <div class="kpi-icon">⏳</div>

        <div class="kpi-value" style="color:var(--purple);">${sv.hours_saved || 0} hrs</div>

function renderCostVsValueCurve(fin) {
  const daily = fin?.daily_burn || {};
  const dates = Object.keys(daily).sort();
  if (!dates.length) {
    return `
    <div class="card">
      <div class="section-title">Cost vs. Value Curve</div>
      <div class="empty-state">No daily telemetry data logged in this range.</div>
    </div>`;
  }

  // Cumulative calculations
  let cumCost = 0;
  let cumHours = 0;
  const points = dates.map(d => {
    const item = daily[d];
    cumCost += (item.cost_usd || 0);
    const daySessions = (item.sessions || 0);
    // 6.5 min saved per session
    cumHours += (daySessions * 6.5) / 60.0;
    const cumGrossVal = cumHours * 75.0; // clinician baseline
    return { date: d, cost: cumCost, hours: cumHours, grossVal: cumGrossVal, sessions: daySessions };
  });

  const maxVal = Math.max(10, ...points.map(p => Math.max(p.cost, p.grossVal)));
  const width = 600, height = 200, padX = 40, padY = 20;
  const innerW = width - padX * 2, innerH = height - padY * 2;

  const getX = idx => padX + (idx / Math.max(1, points.length - 1)) * innerW;
  const getY = val => height - padY - (val / maxVal) * innerH;

  const costPath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(p.cost)}`).join(' ');
  const valPath  = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(p.grossVal)}`).join(' ');
  const valArea  = `${valPath} L ${getX(points.length - 1)} ${height - padY} L ${getX(0)} ${height - padY} Z`;

  const dots = points.map((p, i) => `
    <circle cx="${getX(i)}" cy="${getY(p.grossVal)}" r="4" fill="var(--green)" data-info="Value: ${fmtMoney(p.grossVal)} (${p.hours.toFixed(1)} hrs saved) on ${p.date}" class="curve-dot"></circle>
    <circle cx="${getX(i)}" cy="${getY(p.cost)}" r="3.5" fill="var(--accent)" data-info="AI Cost: ${fmtMoney(p.cost)} on ${p.date}" class="curve-dot"></circle>
  `).join('');

  return `
  <div class="card">
    <div class="section-title">
      <span>Interactive Cost vs. Value Trajectory</span>
      <span class="section-hint">Cumulative AI Cost vs Cumulative Doctor Value Reclaimed</span>
    </div>
    <div class="chart-container" id="curve-chart-box">
      <svg class="chart-svg" viewBox="0 0 ${width} ${height}">
        <!-- Grid lines -->
        <line x1="${padX}" y1="${getY(0)}" x2="${width - padX}" y2="${getY(0)}" stroke="var(--border)" stroke-width="1"/>
        <line x1="${padX}" y1="${getY(maxVal / 2)}" x2="${width - padX}" y2="${getY(maxVal / 2)}" stroke="var(--border)" stroke-dasharray="3 3"/>
        <line x1="${padX}" y1="${getY(maxVal)}" x2="${width - padX}" y2="${getY(maxVal)}" stroke="var(--border)" stroke-dasharray="3 3"/>

        <!-- Area shading under Value Curve -->
        <path d="${valArea}" fill="rgba(52, 211, 153, 0.08)"/>

        <!-- Value Reclaimed Curve (Green) -->
        <path d="${valPath}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Cumulative AI Cost Curve (Blue) -->
        <path d="${costPath}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>

        ${dots}
      </svg>
      <div class="chart-tooltip" id="curve-tooltip"></div>
    </div>
    <div class="chart-legend">
      <div class="legend-item"><span class="legend-line" style="background:var(--green);"></span> Cumulative Doctor Value (${fmtMoney(cumCost > 0 ? points[points.length-1].grossVal : 0)})</div>
      <div class="legend-item"><span class="legend-line" style="background:var(--accent);"></span> Cumulative AI Cost (${fmtMoney(cumCost)})</div>
    </div>
  </div>`;
}

function renderDepartmentMatrix(fin) {
  const depts = fin?.by_department || {};
  const rows = Object.entries(depts).map(([dept, d]) => {
    const sessions = d.sessions || 0;
    const cost = d.cost_usd || 0;
    const costPer = sessions ? (cost / sessions) : 0;
    const totalTokens = (d.prompt_tokens || 0) + (d.completion_tokens || 0);
    const avgTok = sessions ? Math.round(totalTokens / sessions) : 0;

    let tagClass = 'dep-opd';
    if (dept.toLowerCase().includes('er')) tagClass = 'dep-er';
    if (dept.toLowerCase().includes('dental')) tagClass = 'dep-dental';

    return `
    <tr>
      <td><span class="tag ${tagClass}">${esc(dept.toUpperCase())}</span></td>
      <td><b>${sessions}</b></td>
      <td>${fmtMoney(cost)}</td>
      <td><b>${fmtMoney(costPer)}</b></td>
      <td class="cell-mono">${avgTok.toLocaleString()}</td>
    </tr>`;
  }).join('');

  return `
  <div class="card">
    <div class="section-title">
      <span>Department Efficiency Matrix</span>
      <span class="section-hint">Cost per encounter across specialties</span>
    </div>
    <table class="matrix-table">
      <thead>
        <tr>
          <th>Department</th>
          <th>Encounters</th>
          <th>Total Cost</th>
          <th>Cost / Encounter</th>
          <th>Avg Tokens</th>

        ${rows || `<tr><td colspan="5"><div class="empty-state">No department encounters yet.</div></td></tr>`}

}

/* ─────────────────────────────────────────────────────────────
   Tab 2: Operational Overview
   ───────────────────────────────────────────────────────────── */
function renderUsageKpis(usage) {
  const total = usage.length;
  const errors = usage.filter(e => e.status && e.status !== 'ok').length;
  let totalSecSum = 0, totalSecCount = 0;
  let historyUsedCount = 0;

  usage.forEach(e => {
    if (typeof e.total_sec === 'number') { totalSecSum += e.total_sec; totalSecCount++; }
    if (e.use_history) historyUsedCount++;
  });
  const avgSec = totalSecCount ? (totalSecSum / totalSecCount).toFixed(1) + 's' : '—';

  return `
  <div class="section">
    <div class="section-title">Operational Throughput</div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-icon">🗂️</div><div class="kpi-label">Total Consultations</div><div class="kpi-value">${total}</div></div>
      <div class="kpi-card ${errors ? 'kpi-red' : ''}"><div class="kpi-icon">⚠️</div><div class="kpi-label">Pipeline Failures</div><div class="kpi-value" style="color:${errors ? 'var(--red)' : 'var(--text-1)'}">${errors}</div><div class="kpi-subtext">${pct(errors,total)}% error rate</div></div>
      <div class="kpi-card"><div class="kpi-icon">⏱️</div><div class="kpi-label">Avg Pipeline Latency</div><div class="kpi-value">${avgSec}</div></div>
      <div class="kpi-card kpi-green"><div class="kpi-icon">📜</div><div class="kpi-label">Patient History Context</div><div class="kpi-value green">${historyUsedCount}</div><div class="kpi-subtext">${pct(historyUsedCount,total)}% of sessions</div></div>
    </div>
  </div>`;
}

const DIST_COLORS = ['var(--accent)', 'var(--accent-2)', 'var(--green)', 'var(--amber)', 'var(--purple)'];
function distBar(obj, total) {
  const entries = Object.entries(obj).sort((a,b) => b[1]-a[1]);
  const segs = entries.map(([k,v], i) => {
    const w = pct(v, total);
    return `<div style="height:100%; width:${w}%; background:${DIST_COLORS[i % DIST_COLORS.length]};" title="${esc(k)}: ${v} (${w}%)"></div>`;
  }).join('');
  const legend = entries.map(([k,v], i) =>
    `<span style="display:inline-flex; align-items:center; gap:4px;"><span style="width:8px; height:8px; border-radius:50%; background:${DIST_COLORS[i % DIST_COLORS.length]};"></span>${esc(k)} (${v})</span>`
  ).join('');
  return `<div style="height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden; display:flex;">${segs}</div>
          <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:6px; font-size:11px; color:var(--text-2);">${legend}</div>`;
}

function renderDistributions(usage) {
  const total = usage.length;
  if (!total) return '';
  const byDept = {}, byLang = {}, byMode = {};
  usage.forEach(e => {
    byDept[e.department || 'unknown'] = (byDept[e.department || 'unknown'] || 0) + 1;
    byLang[(e.language || 'unknown').toUpperCase()] = (byLang[(e.language || 'unknown').toUpperCase()] || 0) + 1;
    byMode[e.mode || 'unknown'] = (byMode[e.mode || 'unknown'] || 0) + 1;
  });

  return `
  <div class="section">
    <div class="section-title">Consultation Mix</div>
    <div class="card">
      <div style="margin-bottom:14px;"><div style="font-size:11.5px; font-weight:700; margin-bottom:5px;">By Specialty / Department</div>${distBar(byDept, total)}</div>
      <div style="margin-bottom:14px;"><div style="font-size:11.5px; font-weight:700; margin-bottom:5px;">By Clinical Language</div>${distBar(byLang, total)}</div>
      <div><div style="font-size:11.5px; font-weight:700; margin-bottom:5px;">By Dictation Mode</div>${distBar(byMode, total)}</div>
    </div>
  </div>`;
}

function renderSessionsTable(usage, isAdmin) {
  const rows = usage.map((e, i) => {
    const statusTag = (e.status && e.status !== 'ok')
      ? `<span class="tag status-error">${esc(e.status)}</span>`
      : `<span class="tag status-ok">ok</span>`;
    const deptTag = e.department ? `<span class="tag dep-${esc(e.department)}">${esc(e.department.toUpperCase())}</span>` : '—';
    const who = isAdmin ? esc(e.clinician_name || e.sso_user || '—') : `<span class="cell-muted">Anonymized</span>`;
    const sid = e.session_id ? `<span class="cell-mono" title="${esc(e.session_id)}">${esc(shortId(e.session_id))}</span>` : '<span class="cell-muted">—</span>';

    // In PHI-safe mode, raw transcripts are removed
    const detailsBtn = isAdmin
      ? `<button class="btn-details" data-idx="${i}">Details</button>`
      : `<span class="cell-muted" title="Executive view has PHI restricted">—</span>`;

    return `
    <tr class="data-row" id="session-row-${esc(e.session_id || i)}">
      <td>${fmtDate(e.timestamp)}</td>
      <td>${sid}</td>
      <td>${who}</td>
      <td>${deptTag}</td>
      <td>${esc((e.language || '—').toUpperCase())}</td>
      <td>${esc(e.mode || '—')}</td>
      <td>${fmtSec(e.transcription_sec)}</td>
      <td>${fmtSec(e.refinement_sec)}</td>
      <td>${fmtSec(e.total_sec)}</td>
      <td>${statusTag}</td>
      <td>${detailsBtn}</td>
    </tr>
    ${isAdmin ? `
    <tr class="details-row" id="details-${i}" style="display:none">
      <td colspan="11"><pre class="details-json">${esc(JSON.stringify(e, null, 2))}</pre></td>
    </tr>` : ''}`;
  }).join('');

  return `
  <div class="section">
    <div class="section-title">
      <span>Encounter Activity Stream</span>
      <span class="section-hint">${isAdmin ? 'Full audit details available' : 'Individual doctor identities and raw clinical text masked for stakeholder privacy'}</span>
    </div>
    <div class="table-toolbar"><input type="search" id="sessions-search" placeholder="Search department, language, status…"></div>

        <thead>
          <tr>
            <th>When</th><th>Session</th><th>Clinician</th><th>Dept</th><th>Lang</th><th>Mode</th>
            <th>Transcribe</th><th>Refine</th><th>Total</th><th>Status</th><th>${isAdmin ? 'Audit' : ''}</th>
          </tr>
        </thead>
        <tbody>
          ${rows || `<tr><td colspan="11"><div class="empty-state">No encounter activity logged.</div></td></tr>`}
        </tbody>
      </table>
    </div></div>
  </div>`;
}

/* ─────────────────────────────────────────────────────────────
   Interactive Events & Handlers
   ───────────────────────────────────────────────────────────── */
function switchTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const btn = $(`tab-btn-${tabName}`);
  const panel = $(`panel-${tabName}`);
  if (btn) btn.classList.add('active');
  if (panel) panel.classList.add('active');
}

function wireTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      window.__userSwitchedTab = true;
      switchTab(btn.dataset.tab);
    });
  });
}

function wireDetailToggles() {
  document.querySelectorAll('.btn-details').forEach(btn => {
    btn.addEventListener('click', () => {
      const row = $('details-' + btn.dataset.idx);
      if (!row) return;
      const showing = row.style.display !== 'none';
      row.style.display = showing ? 'none' : '';
      btn.textContent = showing ? 'Details' : 'Hide';
    });
  });
}

function wireSearch(inputId, rowSelector) {
  const input = $(inputId);
  if (!input) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    document.querySelectorAll(rowSelector).forEach(tr => {
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

function wireSessionLinks() {
  document.querySelectorAll('.session-link[data-jump]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.jump;
      switchTab('sessions');
      const row = $('session-row-' + sid);
      if (row) {
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        row.style.background = 'rgba(56, 189, 248, 0.2)';
        setTimeout(() => { row.style.background = ''; }, 1500);
      }
    });
  });
}

function initCurveTooltips() {
  const chartBox = $('curve-chart-box');
  const tooltip = $('curve-tooltip');
  if (!chartBox || !tooltip) return;

  document.querySelectorAll('.curve-dot').forEach(dot => {
    dot.addEventListener('mouseenter', e => {
      const info = dot.dataset.info;
      tooltip.textContent = info;
      tooltip.style.display = 'block';
      const rect = chartBox.getBoundingClientRect();
      tooltip.style.left = (e.clientX - rect.left + 10) + 'px';
      tooltip.style.top = (e.clientY - rect.top - 25) + 'px';
    });
    dot.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
    });
  });
}

$('currency-select').addEventListener('change', e => {
  currentCurrency = e.target.value;
  render();
});
$('range-select').addEventListener('change', loadAll);
$('btn-refresh').addEventListener('click', loadAll);

loadAll();
