name: LLM concurrency tests

on:
  push:
  pull_request:

jobs:
  concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r src/requirements.txt pytest pytest-asyncio
      - name: Run concurrency tests
        env:
          LLM_API_KEY: test-key
        run: pytest -k concurrency -q
